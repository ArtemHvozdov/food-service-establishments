{{define "content"}}
{{template "breadcrumbs" .}}
<span class="badge">{{.Type.Name}}</span>
<h1>{{.Name}}</h1>
<p>{{.Address}}</p>
{{if .GoogleMapsURL}}<a class="btn btn--primary" href="{{.GoogleMapsURL}}">Google Maps</a>{{end}}
{{if .InstagramURL}}<a class="btn btn--outline" href="{{.InstagramURL}}">Instagram</a>{{end}}
{{if .FacebookURL}}<a class="btn btn--outline" href="{{.FacebookURL}}">Facebook</a>{{end}}
{{template "backlink" .}}
{{end}}
